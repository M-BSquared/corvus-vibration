[package]
name = "corvus_plugin_vibration"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false
repository = "https://github.com/M-BSquared/corvus-vibration"
description = "The vibration plugin of Corvus GCS"

[dependencies]
corvus_api = { path = "../../src/api" }
eframe = { workspace = true }
serde_json = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.corvus]
loadable = true
name = "Vibration Monitor"
description = "Live PX4 vibration metrics and accelerometer clipping"
icon = "activity"
version = "1.0.0"
